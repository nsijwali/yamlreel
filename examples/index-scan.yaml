# Data scenes demo: a table that is scanned row by row, a sorted index that takes inserts, and a queue.
# Render: yamlreel render examples/index-scan.yaml --out out --preview --no-voice --contact-frames 6
# `--contact-frames 6` writes a contact sheet with six stills per scene, so you can check that the rows reveal
# in order, the scan bar walks down, and nothing overlaps or clips.
meta:
  title: Why an index makes lookups fast
  tags: [databases, indexing]
theme: midnight
formats: [vertical, landscape]
music: {style: koto, seed: 7}
scenes:
  - type: title
    eyebrow: Databases
    title: Index or scan?
    subtitle: What a lookup really does
    seconds: 3
  - type: table
    title: users
    columns: [id, name, email]
    rows:
      - [1, Ada, ada@example.com]
      - [2, Lin, lin@example.com]
      - [3, Kim, kim@example.com]
      - [4, Zoe, zoe@example.com]
      - [5, Eve, eve@example.com]
      - [6, Sam, sam@example.com]
      - ["...", "...", "..."]
    stagger: 0.25
    scan: {at: 2.2, per_row: 0.35, stop: 4, color: accent}
    highlight: [{row: 4, at: 3.8, text: found, color: accent2}]
    counter: {label: rows scanned, to: 10000000, at: 2.2, seconds: 3}
    seconds: 7
  - type: array
    title: Sorted index on name
    items: [Ada, Kim]
    steps:
      - {at: 1.0, insert: Lin}
      - {at: 2.0, insert: Eve}
      - {at: 3.2, mark: [2], text: lookup, color: accent}
      - {at: 4.4, window: [1, 3], text: "binary search"}
      - {at: 5.6, unmark: true}
    seconds: 7
    transition: {type: slide, seconds: 0.4}
  - type: array
    title: A job queue
    items: [job1, job2]
    steps:
      - {at: 1.0, push: job3}
      - {at: 2.0, push: job4}
      - {at: 3.0, pop: front}
      - {at: 4.0, pop: front}
      - {at: 5.0, window: [0, 1], text: "next up"}
    seconds: 7
  - type: stat
    eyebrow: With an index
    value: "4 steps"
    label: instead of scanning every row
    seconds: 3
